<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Secure Payment – Rent IT</title>

  <!-- Bootstrap 5 + Font Awesome -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 2rem 0;
    }
    .navbar {
      background: rgba(0,0,0,0.2) !important;
      backdrop-filter: blur(12px);
      position: sticky;
      top: 0;
      z-index: 1000;
    }
    .payment-container {
      max-width: 520px;
      margin: 0 auto;
      background: white;
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 30px 80px rgba(0,0,0,0.3);
    }
    .payment-header {
      background: #1e293b;
      color: white;
      padding: 3rem 2rem;
      text-align: center;
    }
    .payment-header img {
      height: 80px;
      margin-bottom: 1rem;
      filter: drop-shadow(0 5px 15px rgba(0,0,0,0.4));
    }
    .payment-header h2 {
      font-weight: 700;
      margin: 0;
      font-size: 2rem;
    }
    .amount-box {
      background: #f0f9ff;
      padding: 1.5rem;
      text-align: center;
      border-radius: 16px;
      margin: 2rem;
      border: 2px dashed #0ea5e9;
    }
    .amount-box .price {
      font-size: 2.8rem;
      font-weight: 800;
      color: #1e293b;
    }
    .amount-box small {
      color: #64748b;
      font-size: 1rem;
    }
    .payment-body {
      padding: 2.5rem 2rem;
    }
    .form-control, .form-select {
      height: 58px;
      border-radius: 14px;
      padding: 0 1.3rem;
      font-size: 1.1rem;
      border: 1.8px solid #e2e8f0;
    }
    .form-control:focus {
      border-color: #667eea;
      box-shadow: 0 0 0 0.25rem rgba(102,126,234,0.25);
    }
    .payment-method {
      display: flex;
      gap: 1rem;
      margin-bottom: 2rem;
      flex-wrap: wrap;
    }
    .method-btn {
      flex: 1;
      min-width: 120px;
      padding: 1rem;
      border-radius: 16px;
      text-align: center;
      border: 2px solid #e2e8f0;
      background: #f8fafc;
      cursor: pointer;
      transition: all 0.3s;
      font-weight: 600;
    }
    .method-btn.active {
      border-color: #667eea;
      background: #eef2ff;
      box-shadow: 0 8px 25px rgba(102,126,234,0.2);
    }
    .method-btn i {
      font-size: 1.8rem;
      display: block;
      margin-bottom: 0.5rem;
      color: #667eea;
    }
    .btn-pay {
      background: #667eea;
      color: white;
      height: 60px;
      border-radius: 16px;
      font-size: 1.3rem;
      font-weight: 700;
      width: 100%;
      border: none;
      margin-top: 2rem;
      transition: all 0.4s;
      box-shadow: 0 10px 30px rgba(102,126,234,0.4);
    }
    .btn-pay:hover {
      background: #5a67d8;
      transform: translateY(-4px);
      box-shadow: 0 20px 40px rgba(102,126,234,0.5);
    }
    .secure-notice {
      text-align: center;
      margin-top: 2rem;
      color: #64748b;
      font-size: 0.95rem;
    }
    .secure-notice i {
      color: #10b981;
      margin-right: 0.5rem;
    }
    @media (max-width: 576px) {
      .payment-header { padding: 2.5rem 1.5rem; }
      .payment-header h2 { font-size: 1.7rem; }
      .payment-body { padding: 2rem 1.5rem; }
      .amount-box .price { font-size: 2.3rem; }
    }
  </style>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container-fluid">
      <a class="navbar-brand fw-bold fs-4" href="#" onclick="checkAndRedirect()">Rent IT</a>
      <div class="ms-auto">
        <a href="featuredprojects.html" class="btn btn-outline-light">Back to Home</a>
      </div>
    </div>
  </nav>

  <!-- Payment Card -->
  <div class="container">
    <div class="payment-container">
      <div class="payment-header">
        <img src="./rent-logo.png" alt="Rent IT">
        <h2>Complete Your Payment</h2>
        <p class="mb-0 opacity-80">Secure & Fast Payment Gateway</p>
      </div>

      <div class="payment-body">
        <!-- Amount to Pay -->
        <div class="amount-box">
          <div class="price">৳95,000</div>
          <small>Rent for December 2025 • Dulce Domi, Bashundhara</small>
        </div>

        <!-- Payment Method Selection -->
        <label class="form-label fw-bold">Choose Payment Method</label>
        <div class="payment-method">
          <div class="method-btn active" data-method="bkash">
            <i class="fas fa-mobile-alt"></i>
            bKash
          </div>
          <div class="method-btn" data-method="nagad">
            <i class="fas fa-wallet"></i>
            Nagad
          </div>
          <div class="method-btn" data-method="card">
            <i class="far fa-credit-card"></i>
            Card
          </div>
        </div>

        <!-- Payment Form (bKash by default) -->
        <form action="process_payment.php" method="POST" id="paymentForm">
          <div id="bkashForm">
            <label class="form-label">bKash Number</label>
            <input type="text" name="bkash_number" class="form-control" placeholder="01XXXXXXXXX" required>
            <label class="form-label mt-3">Transaction ID (TrxID)</label>
            <input type="text" name="trxid" class="form-control" placeholder="Enter bKash TrxID" required>
          </div>

          <button type="submit" class="btn-pay">
            Pay ৳95,000 Now
          </button>
        </form>

        <div class="secure-notice">
          <i class="fas fa-lock"></i>
          Your payment is secure • SSL Encrypted • PCI DSS Compliant
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    function checkAndRedirect() {
      fetch('session_status.php')
        .then(r => r.text())
        .then(d => d.trim() === "true" ? location.href = "dashboard.php" : location.href = "featuredprojects.html")
        .catch(() => location.href = "featuredprojects.html");
    }

    // Switch payment method
    document.querySelectorAll('.method-btn').forEach(btn => {
      btn.addEventListener('click', function() {
        document.querySelectorAll('.method-btn').forEach(b => b.classList.remove('active'));
        this.classList.add('active');
        
        const method = this.getAttribute('data-method');
        const form = document.getElementById('paymentForm');
        
        if (method === 'bkash' || method === 'nagad') {
          form.innerHTML = `
            <label class="form-label">${method === 'bkash' ? 'bKash' : 'Nagad'} Number</label>
            <input type="text" name="${method}_number" class="form-control" placeholder="01XXXXXXXXX" required>
            <label class="form-label mt-3">Transaction ID (TrxID)</label>
            <input type="text" name="trxid" class="form-control" placeholder="Enter ${method} TrxID" required>
            <button type="submit" class="btn-pay mt-4">Pay ৳95,000 via ${method.toUpperCase()}</button>
          `;
        } else {
          form.innerHTML = `
            <label class="form-label">Card Number</label>
            <input type="text" name="card_number" class="form-control" placeholder="1234 5678 9012 3456" required>
            <div class="row g-3 mt-3">
              <div class="col-6">
                <label class="form-label">Expiry Date</label>
                <input type="text" name="expiry" class="form-control" placeholder="MM/YY" required>
              </div>
              <div class="col-6">
                <label class="form-label">CVV</label>
                <input type="text" name="cvv" class="form-control" placeholder="123" required>
              </div>
            </div>
            <button type="submit" class="btn-pay mt-4">Pay ৳95,000 Securely</button>
          `;
        }
      });
    });
  </script>
</body>
</html>
