<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log In – Rent IT</title>

  <!-- Bootstrap 5 + Font Awesome 6 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 0;
      margin: 0;
    }
    .login-card {
      max-width: 460px;
      width: 100%;
      background: white;
      border-radius: 28px;
      overflow: hidden;
      box-shadow: 0 30px 80px rgba(0,0,0,0.35);
    }
    .card-header {
      background: #1e293b;
      color: white;
      text-align: center;
      padding: 3.5rem 2rem 2.5rem;
    }
    .card-header img {
      height: 90px;
      margin-bottom: 1.2rem;
      filter: drop-shadow(0 6px 20px rgba(0,0,0,0.4));
    }
    .card-header h2 {
      font-weight: 700;
      font-size: 2.1rem;
      margin: 0;
    }
    .card-header p {
      opacity: 0.9;
      margin-top: 0.8rem;
      font-size: 1.05rem;
    }
    .card-body {
      padding: 3rem 2.5rem;
    }
    .form-control {
      height: 58px;
      border-radius: 16px;
      padding: 0 1.4rem;
      font-size: 1.1rem;
      border: 1.8px solid #e2e8f0;
      margin-bottom: 1.2rem;
    }
    .form-control:focus {
      border-color: #667eea;
      box-shadow: 0 0 0 0.25rem rgba(102,126,234,0.25);
    }
    .btn-login {
      background: #667eea;
      color: white;
      height: 58px;
      border-radius: 16px;
      font-size: 1.2rem;
      font-weight: 700;
      border: none;
      width: 100%;
      transition: all 0.4s;
      box-shadow: 0 10px 30px rgba(102,126,234,0.4);
    }
    .btn-login:hover {
      background: #5a67d8;
      transform: translateY(-4px);
      box-shadow: 0 20px 40px rgba(102,126,234,0.5);
    }
    .extra-links {
      display: flex;
      justify-content: space-between;
      margin-top: 1.8rem;
      flex-wrap: wrap;
      gap: 1rem;
    }
    .extra-links a {
      color: #64748b;
      text-decoration: none;
      font-weight: 600;
      transition: color 0.3s;
    }
    .extra-links a:hover {
      color: #667eea;
    }
    .signup-link {
      text-align: center;
      margin-top: 2rem;
      font-size: 1.05rem;
    }
    .signup-link a {
      color: #667eea;
      font-weight: 700;
      text-decoration: none;
    }
    .signup-link a:hover {
      text-decoration: underline;
    }
    .navbar {
      position: fixed;
      top: 0;
      width: 100%;
      background: rgba(0,0,0,0.15);
      backdrop-filter: blur(10px);
      z-index: 1000;
    }
    @media (max-width: 576px) {
      .card-header { padding: 2.8rem 1.5rem 2rem; }
      .card-header h2 { font-size: 1.8rem; }
      .card-body { padding: 2.5rem 1.8rem; }
      .extra-links { flex-direction: column; text-align: center; }
    }
  </style>
</head>
<body>

  <!-- Fixed Top Navbar -->
  <nav class="navbar navbar-dark">
    <div class="container">
      <a class="navbar-brand fw-bold fs-4" href="#" onclick="checkAndRedirect()">
        Rent IT
      </a>
    </div>
  </nav>

  <!-- Login Card -->
  <div class="container">
    <div class="login-card">
      <div class="card-header">
        <img src="./rent-logo.png" alt="Rent IT Logo">
        <h2>Welcome Back</h2>
        <p>Log in to access your dashboard and listings</p>
      </div>

      <div class="card-body">
        <form action="process_login.php" method="POST" novalidate>
          <input type="email" name="email" class="form-control" placeholder="Email Address" required>
          <input type="password" name="password" class="form-control" placeholder="Password" required minlength="6">

          <button type="submit" class="btn-login mt-3">
            Log In Securely
          </button>
        </form>

        <div class="extra-links">
          <a href="forgot-password.html">Forgot Password?</a>
          <a href="signup.html">Create Account</a>
        </div>

        <div class="signup-link">
          New to Rent IT? <a href="signup.html">Sign up for free</a>
        </div>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    function checkAndRedirect() {
      fetch('session_status.php')
        .then(r => r.text())
        .then(data => {
          if (data.trim() === "true") {
            window.location.href = "dashboard.php";
          } else {
            window.location.href = "featuredprojects.html";
          }
        })
        .catch(() => window.location.href = "featuredprojects.html");
    }

    // Optional: Show error message if login fails (you can enhance with PHP)
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('error') === '1') {
      alert('Invalid email or password. Please try again.');
    }
  </script>
</body>
</html>
