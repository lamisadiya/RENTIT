<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Luxury Apartments in Gulshan – Rent IT</title>

  <!-- Bootstrap 5 + Font Awesome -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f8fafc;
      margin: 0;
    }
    .navbar {
      background: #1e293b !important;
      box-shadow: 0 4px 20px rgba(0,0,0,0.12);
      position: sticky;
      top: 0;
      z-index: 1000;
    }
    .hero {
      background: linear-gradient(rgba(15,23,42,0.92), rgba(15,23,42,0.88)),
                  url('https://images.unsplash.com/photo-1512453979798-5ea1b4d2b9e0?q=80&w=2070&auto=format') center/cover;
      color: white;
      padding: 9rem 0 6rem;
      text-align: center;
    }
    .hero h1 {
      font-size: 3.2rem;
      font-weight: 800;
      text-shadow: 0 4px 20px rgba(0,0,0,0.6);
    }
    .hero p {
      font-size: 1.3rem;
      max-width: 700px;
      margin: 1rem auto 0;
      opacity: 0.95;
    }
    .location-badge {
      background: #f59e0b;
      color: white;
      padding: 0.6rem 1.8rem;
      border-radius: 50px;
      font-weight: 700;
      font-size: 1.1rem;
      display: inline-block;
      margin-top: 1rem;
    }
    .apartment-card {
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 12px 35px rgba(0,0,0,0.12);
      transition: all 0.4s ease;
      background: white;
    }
    .apartment-card:hover {
      transform: translateY(-18px);
      box-shadow: 0 30px 60px rgba(0,0,0,0.22);
    }
    .apartment-img {
      height: 320px;
      object-fit: cover;
      transition: transform 0.6s ease;
    }
    .apartment-card:hover .apartment-img {
      transform: scale(1.08);
    }
    .card-body {
      padding: 2rem;
    }
    .price {
      font-size: 2rem;
      font-weight: 800;
      color: #1e293b;
    }
    .badge-premium {
      background: #8b5cf6;
      color: white;
      padding: 0.4rem 1rem;
      border-radius: 50px;
      font-size: 0.9rem;
    }
    .features-list {
      list-style: none;
      padding: 0;
      margin: 1rem 0;
    }
    .features-list li {
      padding: 0.4rem 0;
      color: #475569;
    }
    .features-list i {
      color: #10b981;
      margin-right: 0.8rem;
    }
    .btn-view {
      background: #667eea;
      color: white;
      padding: 0.9rem 2rem;
      border-radius: 50px;
      font-weight: 600;
      text-decoration: none;
      display: inline-block;
      transition: all 0.3s;
    }
    .btn-view:hover {
      background: #5a67d8;
      transform: translateY(-3px);
    }
    .no-results {
      text-align: center;
      padding: 4rem 2rem;
      color: #64748b;
      font-size: 1.3rem;
    }
    @media (max-width: 768px) {
      .hero h1 { font-size: 2.4rem; }
      .hero p { font-size: 1.1rem; }
      .apartment-img { height: 240px; }
      .price { font-size: 1.7rem; }
    }
  </style>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container">
      <a class="navbar-brand fw-bold fs-4" href="#" onclick="checkAndRedirect()">Rent IT</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="nav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="featuredprojects.html">All Areas</a></li>
          <li class="nav-item"><a class="nav-link" href="login.html">Sign In</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Hero -->
  <section class="hero">
    <div class="container">
      <h1>Luxury Living in Gulshan</h1>
      <p>Discover premium apartments in Dhaka's most prestigious neighborhood</p>
      <div class="location-badge">Gulshan 1 & 2 • Dhaka</div>
    </div>
  </section>

  <!-- Apartment Grid -->
  <div class="container py-5">
    <div class="row g-4" id="gulshanApartments">
      <!-- Apartments will be injected here by JS -->
      <div class="col-12 text-center py-5">
        <div class="spinner-border text-primary" role="status">
          <span class="visually-hidden">Loading...</span>
        </div>
        <p class="mt-3 text-muted">Loading luxury apartments...</p>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    function checkAndRedirect() {
      fetch('session_status.php')
        .then(r => r.text())
        .then(d => d.trim() === "true" ? location.href = "dashboard.php" : location.href = "featuredprojects.html")
        .catch(() => location.href = "featuredprojects.html");
    }

    // Load Gulshan apartments (from a4.html and a5.html or a JSON/API)
    document.addEventListener("DOMContentLoaded", function () {
      const container = document.getElementById("gulshanApartments");
      
      const apartments = [
        {
          id: 4,
          title: "Gulshan Lakeview Residence",
          price: "৳2,85,000",
          size: "2,800 sqft",
          beds: 4,
          baths: 4,
          image: "3.webp",
          link: "a4.html",
          features: ["Lake View", "Gym & Pool", "24/7 Security", "Rooftop Garden"]
        },
        {
          id: 5,
          title: "Gulshan Elite Tower",
          price: "৳3,20,000",
          size: "3,100 sqft",
          beds: 4,
          baths: 5,
          image: "4.webp",
          link: "a5.html",
          features: ["Penthouse Style", "Private Terrace", "Smart Home", "Concierge"]
        }
      ];

      if (apartments.length === 0) {
        container.innerHTML = `<div class="no-results">No apartments available in Gulshan right now.</div>`;
        return;
      }

      container.innerHTML = apartments.map(apt => `
        <div class="col-md-6 col-lg-6">
          <div class="apartment-card">
            <img src="${apt.image}" alt="${apt.title}" class="apartment-img w-100">
            <div class="card-body">
              <h3 class="mb-2">${apt.title}</h3>
              <div class="price mb-3">${apt.price}<small class="text-muted">/month</small></div>
              <p class="text-muted mb-3">
                <i class="fas fa-ruler-combined"></i> ${apt.size} • 
                <i class="fas fa-bed"></i> ${apt.beds} Beds • 
                <i class="fas fa-bath"></i> ${apt.baths} Baths
              </p>
              <ul class="features-list">
                ${apt.features.map(f => `<li><i class="fas fa-check-circle"></i> ${f}</li>`).join('')}
              </ul>
              <div class="d-flex justify-content-between align-items-center mt-4">
                <span class="badge-premium">Premium</span>
                <a href="${apt.link}" class="btn-view">View Details</a>
              </div>
            </div>
          </div>
        </div>
      `).join('');
    });
  </script>
</body>
</html>
