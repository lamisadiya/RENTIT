<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Add Apartment - Rent IT</title>

  <!-- Bootstrap 5 + Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

  <style>
    body {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      font-family: 'Segoe UI', sans-serif;
    }
    .form-container {
      max-width: 900px;
      margin: 2rem auto;
      background: white;
      border-radius: 20px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.2);
      overflow: hidden;
    }
    .form-header {
      background: #1a1a2e;
      color: white;
      padding: 2rem;
      text-align: center;
    }
    .form-header img {
      height: 80px;
      margin-bottom: 1rem;
    }
    .form-body {
      padding: 2.5rem;
    }
    .section-title {
      color: #1a1a2e;
      border-bottom: 3px solid #764ba2;
      padding-bottom: 0.5rem;
      margin: 2rem 0 1.5rem;
    }
    .btn-submit {
      background: #764ba2;
      border: none;
      padding: 0.9rem 2.5rem;
      font-size: 1.1rem;
      border-radius: 50px;
    }
    .btn-submit:hover {
      background: #5a3780;
      transform: translateY(-2px);
    }
  </style>
</head>
<body>

<nav class="navbar navbar-dark bg-dark">
  <div class="container-fluid">
    <a class="navbar-brand fw-bold" href="#" onclick="checkAndRedirect()">
      Rent IT
    </a>
  </div>
</nav>

<div class="container-fluid">
  <div class="form-container">
    <div class="form-header">
      <img src="./rent-logo.png" alt="Rent IT Logo">
      <h2 class="mb-0">List Your Apartment</h2>
      <p class="mb-0 mt-2 opacity-75">Fill in the details to add your property</p>
    </div>

    <div class="form-body">
      <form id="apartmentForm">

        <!-- Apartment Details -->
        <h4 class="section-title"><i class="fas fa-home me-2"></i>Apartment Details</h4>
        <div class="row g-3">
          <div class="col-md-6"><input type="text" class="form-control" name="apartmentName" placeholder="Apartment Name" required></div>
          <div class="col-md-6"><input type="text" class="form-control" name="sqrfoot" placeholder="Square Feet (e.g. 1500)" required></div>
          <div class="col-md-6"><input type="text" class="form-control" name="rent" placeholder="Monthly Rent (BDT)" required></div>
          <div class="col-md-6"><input type="number" class="form-control" name="roomNo" placeholder="Number of Rooms" min="1" required></div>
        </div>

        <!-- Owner Personal Info -->
        <h4 class="section-title mt-5"><i class="fas fa-user me-2"></i>Owner Information</h4>
        <div class="row g-3">
          <div class="col-md-6"><input type="text" class="form-control" name="name" placeholder="Full Name" required></div>
          <div class="col-md-6"><input type="email" class="form-control" name="email" placeholder="Email Address" required></div>
          <div class="col-md-6"><input type="tel" class="form-control" name="phone" placeholder="Phone Number" required></div>
          <div class="col-md-6"><input type="date" class="form-control" name="dob" required></div>
          <div class="col-md-6"><input type="text" class="form-control" name="nid" placeholder="NID Number" required></div>
        </div>

        <!-- Address -->
        <h4 class="section-title mt-5"><i class="fas fa-map-marker-alt me-2"></i>Property Location</h4>
        <div class="row g-3">
          <div class="col-12"><input type="text" class="form-control" name="address" placeholder="Full Address" required></div>
          <div class="col-md-4"><input type="text" class="form-control" name="city" placeholder="City (e.g. Dhaka)" required></div>
          <div class="col-md-4">
            <select class="form-select" name="area" required>
              <option value="">-- Select Area --</option>
              <option>Banani</option>
              <option>Bashundhara</option>
              <option>Gulshan</option>
              <option>Uttara</option>
              <option>Dhanmondi</option>
              <option>Mirpur</option>
            </select>
          </div>
          <div class="col-md-4"><input type="text" class="form-control" name="zip" placeholder="Zip Code" required></div>
        </div>

        <!-- Additional Info -->
        <h4 class="section-title mt-5"><i class="fas fa-info-circle me-2"></i>Additional Information</h4>
        <div class="row g-3">
          <div class="col-12">
            <textarea class="form-control" name="rental_history" rows="3" placeholder="Previous rental history (optional)"></textarea>
          </div>
          <div class="col-12">
            <label class="form-label fw-bold">Employment Status</label><br>
            <div class="form-check form-check-inline">
              <input class="form-check-input" type="radio" name="employment_status" value="employed" required>
              <label class="form-check-label">Employed</label>
            </div>
            <div class="form-check form-check-inline">
              <input class="form-check-input" type="radio" name="employment_status" value="unemployed">
              <label class="form-check-label">Unemployed</label>
            </div>
            <div class="form-check form-check-inline">
              <input class="form-check-input" type="radio" name="employment_status" value="self-employed">
              <label class="form-check-label">Self-Employed</label>
            </div>
          </div>
        </div>

        <!-- Submit -->
        <div class="text-center mt-5">
          <button type="submit" class="btn btn-primary btn-lg btn-submit shadow-lg">
            Add Apartment
          </button>
        </div>
      </form>
    </div>
  </div>
</div>

<!-- Scripts -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
  function checkAndRedirect() {
    fetch('session_status.php')
      .then(r => r.text())
      .then(d => d.trim() === "true" ? location.href = "dashboard.php" : location.href = "featuredprojects.html")
      .catch(() => location.href = "featuredprojects.html");
  }

  document.getElementById("apartmentForm").addEventListener("submit", function(e) {
    e.preventDefault();
    const fd = new FormData(this);

    fetch("insert_data.php", {
      method: "POST",
      body: fd
    })
    .then(r => r.json())
    .then(res => {
      if (res.success) {
        alert("Apartment added successfully!");
        window.location.href = "apartmentsuccess.html";
      } else {
        alert(res.message || "Something went wrong");
      }
    })
    .catch(err => {
      console.error(err);
      alert("Network error. Please try again.");
    });
  });
</script>
</body>
</html>
