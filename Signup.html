<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign Up – Rent IT</title>

  <!-- Bootstrap 5 + Font Awesome 6 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 2rem 0;
    }
    .signup-card {
      max-width: 480px;
      margin: 0 auto;
      background: white;
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 25px 60px rgba(0,0,0,0.3);
    }
    .card-header {
      background: #1e293b;
      color: white;
      text-align: center;
      padding: 3rem 2rem;
    }
    .card-header img {
      height: 90px;
      margin-bottom: 1rem;
      filter: drop-shadow(0 5px 15px rgba(0,0,0,0.3));
    }
    .card-header h2 {
      font-weight: 700;
      margin: 0;
    }
    .card-body {
      padding: 3rem 2.5rem;
    }
    .form-control {
      height: 56px;
      border-radius: 14px;
      padding: 0 1.3rem;
      font-size: 1.05rem;
      border: 1.5px solid #e2e8f0;
      margin-bottom: 1rem;
    }
    .form-control:focus {
      border-color: #667eea;
      box-shadow: 0 0 0 0.25rem rgba(102,126,234,0.25);
    }
    .row.g-3 .form-control {
      margin-bottom: 0;
    }
    .btn-register {
      background: #667eea;
      color: white;
      height: 56px;
      border-radius: 14px;
      font-size: 1.1rem;
      font-weight: 600;
      border: none;
      width: 100%;
      transition: all 0.3s;
    }
    .btn-register:hover {
      background: #5a67d8;
      transform: translateY(-3px);
      box-shadow: 0 12px 30px rgba(102,126,234,0.4);
    }
    .login-link {
      text-align: center;
      margin-top: 1.5rem;
      color: #64748b;
    }
    .login-link a {
      color: #667eea;
      font-weight: 600;
      text-decoration: none;
    }
    .login-link a:hover {
      text-decoration: underline;
    }
    .navbar {
      background: rgba(0,0,0,0.15) !important;
      backdrop-filter: blur(10px);
      position: fixed;
      top: 0;
      width: 100%;
      z-index: 1000;
    }
  </style>
</head>
<body>

  <!-- Fixed Top Navbar -->
  <nav class="navbar navbar-dark">
    <div class="container">
      <a class="navbar-brand fw-bold fs-4" href="#" onclick="checkAndRedirect()">
        Rent IT
      </a>
    </div>
  </nav>

  <!-- Sign Up Card -->
  <div class="container">
    <div class="signup-card">
      <div class="card-header">
        <img src="./rent-logo.png" alt="Rent IT Logo">
        <h2>Create Your Account</h2>
        <p class="mb-0 opacity-75">Join thousands finding their perfect home</p>
      </div>

      <div class="card-body">
        <form action="process_signup.php" method="POST" novalidate>
          <div class="row g-3">
            <div class="col-md-6">
              <input type="text" name="fname" class="form-control" placeholder="First Name" required>
            </div>
            <div class="col-md-6">
              <input type="text" name="lname" class="form-control" placeholder="Last Name" required>
            </div>
          </div>

          <input type="email" name="email" class="form-control" placeholder="Email Address" required>
          <input type="tel" name="phone" class="form-control" placeholder="Phone Number" required>

          <input type="password" name="password" class="form-control" placeholder="Create Password" minlength="6" required>
          <input type="password" name="confirm_password" class="form-control" placeholder="Confirm Password" required>

          <button type="submit" class=" class="btn btn-register mt-4">
            Register Now
          </button>
        </form>

        <div class="login-link">
          Already have an account? <a href="login.html">Log In Here</a>
        </div>
      </div>
    </div>
  </div>

  <!-- Optional Footer (hidden on mobile if needed) -->
  <footer class="text-white text-center mt-5 py-4 d-none d-md-block" style="background: rgba(0,0,0,0.2); backdrop-filter: blur(10px);">
    <p class="mb-0">© 2025 Rent IT – Find Your Perfect Home</p>
  </footer>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    function checkAndRedirect() {
      fetch('session_status.php')
        .then(r => r.text())
        .then(data => {
          if (data.trim() === "true") {
            window.location.href = "dashboard.php";
          } else {
            window.location.href = "featuredprojects.html";
          }
        })
        .catch(() => window.location.href = "featuredprojects.html");
    }

    // Optional: Simple password match check
    document.querySelector('form').addEventListener('submit', function(e) {
      const pass = this.password.value;
      const confirm = this.confirm_password.value;
      if (pass !== confirm) {
        e.preventDefault();
        alert("Passwords do not match!");
      }
    });
  </script>
</body>
</html>
