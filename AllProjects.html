<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>All Projects - Rent IT Admin</title>

  <!-- Bootstrap 5 + Font Awesome -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f8fafc;
      min-height: 100vh;
    }
    .navbar {
      background: #1e293b !important;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }
    .search-bar {
      max-width: 500px;
    }
    .page-title {
      color: #1e293b;
      font-weight: 700;
      margin-bottom: 2rem;
    }
    .project-card {
      background: white;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 8px 25px rgba(0,0,0,0.08);
      transition: all 0.3s ease;
      height: 100%;
    }
    .project-card:hover {
      transform: translateY(-10px);
      box-shadow: 0 20px 40px rgba(0,0,0,0.15);
    }
    .project-img {
      height: 220px;
      object-fit: cover;
      width: 100%;
    }
    .project-body {
      padding: 1.5rem;
    }
    .location-badge {
      background: #3b82f6;
      color: white;
      padding: 0.4rem 0.9rem;
      border-radius: 50px;
      font-size: 0.85rem;
      font-weight: 600;
    }
    .price {
      font-size: 1.4rem;
      font-weight: 700;
      color: #16a34a;
    }
    .no-results {
      text-align: center;
      padding: 4rem 2rem;
      color: #64748b;
    }
    .loading {
      text-align: center;
      padding: 3rem;
      color: #64748b;
    }
    @media (max-width: 768px) {
      .search-bar {
        max-width: 100%;
      }
    }
  </style>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container-fluid">
      <a class="navbar-brand fw-bold fs-4" href="admin_dashboard.html">
        Rent IT Admin
      </a>

      <div class="d-flex align-items-center gap-3">
        <!-- Location Filter -->
        <select id="locationFilter" class="form-select w-auto" onchange="filterByLocation()">
          <option value="">All Locations</option>
          <option value="gulshan">Gulshan</option>
          <option value="uttara">Uttara</option>
          <option value="bashundhara">Bashundhara</option>
          <option value="banani">Banani</option>
          <option value="dhanmondi">Dhanmondi</option>
        </select>

        <a href="admin_dashboard.html" class="btn btn-outline-light">
          Back to Dashboard
        </a>
      </div>
    </div>
  </nav>

  <div class="container py-5">
    <h2 class="page-title text-center">
      <i class="fas fa-building me-3"></i>All Listed Apartments
    </h2>

    <div id="loadingMessage" class="loading">
      <i class="fas fa-spinner fa-spin fa-3x mb-3"></i>
      <p>Loading apartments...</p>
    </div>

    <div id="projectGrid" class="row g-4">
      <!-- Projects will be injected here by JavaScript -->
    </div>

    <div id="noResults" class="no-results" style="display: none;">
      <i class="fas fa-home fa-4x mb-4 text-muted"></i>
      <h4>No apartments found</h4>
      <p>Try selecting a different location or check back later.</p>
    </div>
  </div>

  <!-- Single JS to load all apartments (replace your 3 separate files) -->
  <script>
    const projects = [];

    // Combine all your old data into one clean format
    // Example (you can expand this):
    const allApartments = [
      { id: 1, name: "Edison Amour", location: "gulshan", price: "65,000", sqft: "1600", rooms: 3, img: "2.webp" },
      { id: 2, name: "Dulce Domi", location: "bashundhara", price: "95,000", sqft: "1500", rooms: 3, img: "3.webp" },
      { id: 3, name: "Sky Villa", location: "uttara", price: "78,000", sqft: "1800", rooms: 4, img: "apartment1.jpg" },
      { id: 4, name: "Green Haven", location: "banani", price: "85,000", sqft: "1700", rooms: 3, img: "apartment2.jpg" },
      // Add more...
    ];

    function renderProjects(data) {
      const grid = document.getElementById("projectGrid");
      const noResults = document.getElementById("noResults");
      const loading = document.getElementById("loadingMessage");

      if (data.length === 0) {
        grid.innerHTML = "";
        noResults.style.display = "block";
        loading.style.display = "none";
        return;
      }

      noResults.style.display = "none";
      loading.style.display = "none";

      grid.innerHTML = data.map(apartment => `
        <div class="col-md-6 col-lg-4">
          <div class="project-card">
            <img src="${apartment.img}" alt="${apartment.name}" class="project-img">
            <div class="project-body">
              <div class="d-flex justify-content-between align-items-start mb-3">
                <h5 class="mb-0">${apartment.name}</h5>
                <span class="location-badge">${apartment.location.toUpperCase()}</span>
              </div>
              <p class="price">৳${apartment.price}/month</p>
              <div class="d-flex gap-3 text-muted small">
                <span><i class="fas fa-ruler-combined"></i> ${apartment.sqft} sq ft</span>
                <span><i class="fas fa-bed"></i> ${apartment.rooms} Rooms</span>
              </div>
              <div class="mt-3">
                <a href="edit_apartment.php?id=${apartment.id}" class="btn btn-outline-primary btn-sm me-2">
                  Edit
                </a>
                <button onclick="deleteApartment(${apartment.id})" class="btn btn-outline-danger btn-sm">
                  Delete
                </button>
              </div>
            </div>
          </div>
        </div>
      `).join("");
    }

    function filterByLocation() {
      const location = document.getElementById("locationFilter").value;
      const filtered = location ? allApartments.filter(p => p.location === location) : allApartments;
      renderProjects(filtered);
    }

    function deleteApartment(id) {
      if (confirm("Are you sure you want to delete this apartment?")) {
        // Add AJAX delete call here
        alert("Apartment deleted (connect to backend)");
      }
    }

    // Load all on page start
    window.onload = () => {
      renderProjects(allApartments);
    };
  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
