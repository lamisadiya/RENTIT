<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin Login - Rent IT</title>

  <!-- Bootstrap 5 + Font Awesome -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      padding: 2rem 0;
    }
    .login-card {
      max-width: 420px;
      width: 100%;
      margin: 0 auto;
      background: white;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 20px 50px rgba(0,0,0,0.3);
    }
    .login-header {
      background: #1e3c72;
      color: white;
      text-align: center;
      padding: 2.5rem 1rem;
    }
    .login-header img {
      height: 80px;
      margin-bottom: 1rem;
      filter: drop-shadow(0 4px 10px rgba(0,0,0,0.3));
    }
    .login-body {
      padding: 2.5rem;
    }
    .form-control {
      height: 50px;
      border-radius: 12px;
      padding: 0 1rem;
      font-size: 1rem;
    }
    .btn-login {
      height: 50px;
      border-radius: 12px;
      font-weight: 600;
      font-size: 1.1rem;
      background: #1e3c72;
      border: none;
      transition: all 0.3s;
    }
    .btn-login:hover {
      background: #16305a;
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(30,60,114,0.4);
    }
    .extra-links a {
      color: #6c757d;
      text-decoration: none;
      font-size: 0.95rem;
    }
    .extra-links a:hover {
      color: #1e3c72;
      text-decoration: underline;
    }
    .navbar {
      background: rgba(0,0,0,0.2) !important;
      backdrop-filter: blur(10px);
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 1000;
    }
  </style>
</head>
<body>

  <!-- Top Navbar -->
  <nav class="navbar navbar-dark">
    <div class="container-fluid">
      <a class="navbar-brand fw-bold fs-4" href="#" onclick="checkAndRedirect()">
        Rent IT
      </a>
    </div>
  </nav>

  <!-- Login Card -->
  <div class="login-card">
    <div class="login-header">
      <img src="./rent-logo.png" alt="Rent IT Logo">
      <h3 class="mb-0">Admin Login</h3>
      <small class="opacity-75">Secure access to admin panel</small>
    </div>

    <div class="login-body">
      <form action="process_adminlogin.php" method="POST">
        <div class="mb-3">
          <input type="email" name="email" class="form-control" placeholder="Email Address" required>
        </div>
        <div class="mb-4">
          <input type="password" name="password" class="form-control" placeholder="Password" required>
        </div>
        <button type="submit" class="btn btn-primary w-100 btn-login">
          Log In
        </button>
      </form>

      <div class="extra-links text-center mt-4">
        <a href="Signup.html">Create Admin Account</a>
        <span class="mx-2 text-muted">|</span>
        <a href="#">Forgot Password?</a>
      </div>
    </div>
  </div>

  <!-- Footer (optional – hidden on mobile if needed) -->
  <footer class="text-white text-center mt-5 position-fixed bottom-0 w-100 py-3 d-none d-md-block" style="background: rgba(0,0,0,0.2); backdrop-filter: blur(10px);">
    <p class="mb-0">© 2025 Rent IT – All Rights Reserved</p>
  </footer>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    function checkAndRedirect() {
      fetch('session_status.php')
        .then(r => r.text())
        .then(data => {
          if (data.trim() === "true") {
            window.location.href = "dashboard.php";
          } else {
            window.location.href = "featuredprojects.html";
          }
        })
        .catch(() => window.location.href = "featuredprojects.html");
    }
  </script>
</body>
</html>
